name: Refresh attendance KPIs

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

concurrency:
  group: refresh-kpis
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      HOUSE_YEARS: "2025-2026"
      CONGRESSES: "119-119"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build KPIs
        run: python scripts/build_kpis.py

      - name: Commit changed KPI data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/kpis.csv public/data/kpis.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh attendance KPIs [skip ci]"
          git push
