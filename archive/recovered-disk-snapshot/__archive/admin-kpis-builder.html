<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capitol League — KPI Builder (v2)</title>
  <style>
    :root{--bg:#0d101b;--panel:#171a2b;--fg:#e7e9f4;--muted:#8ea0c2}
    body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;margin:0}
    .wrap{max-width:900px;margin:0 auto;padding:24px}
    .panel{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
    h1{margin:0 0 12px 0}
    .muted{color:var(--muted)}
    button{background:#0f1424;border:1px solid rgba(126,165,255,.5);color:var(--fg);padding:10px 14px;border-radius:999px;cursor:pointer;margin-right:8px}
    code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px}
    pre{white-space:pre-wrap;background:#0f1424;border:1px solid rgba(255,255,255,.08);padding:12px;border-radius:12px;max-height:320px;overflow:auto}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>KPI Builder (GovTrack → <code>kpis.json</code>) — v2</h1>
      <p class="muted">Run this page from your dev server: <strong>http://localhost:5500/admin-kpis-builder.html</strong>. Some browsers block API calls when opened as a <code>file://</code> tab.</p>
      <div style="margin:10px 0">
        <button id="run">Build kpis.json</button>
        <button id="test">Test API</button>
        <span id="status" class="muted" style="margin-left:10px"></span>
      </div>
      <pre id="preview" class="muted"></pre>
      <p class="muted">Save the downloaded file as <code>kpis.json</code> next to your <code>cards.html</code>.</p>
    </section>
  </main>
<script>
const BASE='https://www.govtrack.us/api/v2/role?current=true&limit=200';
async function fetchJSON(u){
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok){ throw new Error('HTTP '+r.status); }
  return r.json();
}
async function getAllPages(){
  const first=await fetchJSON(BASE);
  const total=first?.meta?.total_count ?? (first?.objects?.length||0);
  const pageSize=first?.meta?.limit ?? 200;
  let pages=Math.ceil(total/pageSize)||1;
  const out=[...first.objects||[]];
  const promises=[];
  for(let offset=pageSize; offset<total; offset+=pageSize){
    const url=BASE+'&offset='+offset;
    promises.push(fetchJSON(url).then(d=> out.push(...(d.objects||[]))));
  }
  await Promise.all(promises);
  return out;
}
function normalizeRole(r){
  const person=r.person||{}; const id=person.id;
  const total=('total_votes' in r)? r.total_votes : (('votes' in r)? r.votes : 0);
  let missed=('missed_votes' in r)? r.missed_votes : null;
  const pct=('missed_votes_pct' in r)? r.missed_votes_pct : null;
  if(missed==null && pct!=null && total){ missed=Math.round(total*pct/100); }
  return { id, total, missed, chamber: r.role_type, state: r.state, name: person.name };
}
function download(name, text){ const blob=new Blob([text],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=Object.assign(document.createElement('a'),{href:url,download:name}); a.click(); URL.revokeObjectURL(url); }
document.getElementById('test').addEventListener('click', async()=>{
  const status=document.getElementById('status'); const preview=document.getElementById('preview');
  status.textContent='Testing…'; preview.textContent='';
  try{
    const data = await fetchJSON(BASE);
    const count = data?.objects?.length || 0;
    preview.textContent = 'First page objects: '+count+' of '+(data?.meta?.total_count||'?')+'\n\nSample:\n'+JSON.stringify(data.objects?.slice(0,3), null, 2);
    status.textContent='OK';
  }catch(err){ status.textContent='Failed: '+(err.message||err); }
});
document.getElementById('run').addEventListener('click', async()=>{
  const status=document.getElementById('status'); const preview=document.getElementById('preview');
  status.textContent='Fetching all pages…'; preview.textContent='';
  try{
    const roles = await getAllPages();
    const out={};
    for(const r of roles){
      const n=normalizeRole(r);
      if(n.id!=null){ out[n.id]={ total_votes:n.total||0, missed_votes:n.missed||0 }; }
    }
    const text=JSON.stringify(out,null,2);
    download('kpis.json', text);
    preview.textContent = 'Built entries: '+Object.keys(out).length+'\n\nExample:\n'+text.slice(0,1500)+'\n...';
    status.textContent='Done. Save as kpis.json next to cards.html';
  }catch(err){
    status.textContent='Failed: '+(err.message||err);
  }
});
</script>
</body>
</html>
