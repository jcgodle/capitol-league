<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KPIs Easy Builder v3 — GovTrack → kpis.json</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{background:#0b1220;color:#e8eef9;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial;
         padding:32px;max-width:980px;margin:0 auto}
    h1{font-size:28px;margin:0 0 12px}
    .card{background:#121a2e;border:1px solid #29324a;border-radius:14px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
    button{background:#1b2b50;color:#e8eef9;border:1px solid #2f4477;border-radius:24px;padding:10px 16px;
           cursor:pointer;font-weight:600;margin-right:10px}
    button:disabled{opacity:.5;cursor:not-allowed}
    pre{background:#0f1629;border:1px solid #202a45;padding:12px;border-radius:12px;white-space:pre-wrap;max-height:300px;overflow:auto}
    .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
    .ok{color:#7dd97d}.warn{color:#f5c97a}.bad{color:#ff8a8a}
  </style>
</head>
<body>
  <h1>KPI Builder v3 (GovTrack → <code>kpis.json</code>)</h1>
  <div class="card">
    <p>Open from <strong>http://localhost:5500/kpis-easy-builder-v3.html</strong>. Click Build, then Download. Save as <code>kpis.json</code> next to your <code>cards.html</code>.</p>
    <div class="row" style="margin:14px 0 10px">
      <button id="btnBuild">Build kpis.json</button>
      <button id="btnTest">Test API</button>
      <a id="dl" download="kpis.json" style="display:none"></a>
      <span id="status"></span>
    </div>
    <pre id="log">Ready.</pre>
  </div>

<script>
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const btnBuild = document.getElementById('btnBuild');
const btnTest = document.getElementById('btnTest');
const dl = document.getElementById('dl');

function log(...a){
  const line = a.map(x=>typeof x==='string'?x:JSON.stringify(x,null,2)).join(' ');
  logEl.textContent += '\n' + line;
  logEl.scrollTop = logEl.scrollHeight;
}
function setStatus(txt, cls){
  statusEl.textContent = txt||'';
  statusEl.className = cls||'';
}

async function j(u){
  const r = await fetch(u, {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status+' '+u);
  return r.json();
}

function addItem(map, item){
  const pid = item?.person__id;
  if (pid==null) return;
  const total = (('total_votes' in item)? item.total_votes : (('votes' in item)? item.votes : 0)) || 0;
  let missed = ('missed_votes' in item)? item.missed_votes : null;
  const pct = ('missed_votes_pct' in item)? item.missed_votes_pct : null;
  if (missed==null && pct!=null && total){ missed = Math.round(total*pct/100); }
  const existing = map.get(pid) || { total_votes: 0, missed_votes: 0 };
  if (total > existing.total_votes) {
    map.set(pid, { total_votes: total, missed_votes: missed||0 });
  } else if (!map.has(pid)) {
    map.set(pid, { total_votes: total, missed_votes: missed||0 });
  }
}

async function buildKPIs(){
  setStatus('Building…','warn');
  log('Starting build…');
  const fields = 'person__id,total_votes,missed_votes,missed_votes_pct,votes';
  const base = 'https://www.govtrack.us/api/v2/role?current=true&limit=200&fields=' + encodeURIComponent(fields);
  const first = await j(base);
  const total = (first.meta && first.meta.total_count) || (first.objects?.length || 0);
  const limit = (first.meta && first.meta.limit) || 200;
  const map = new Map();
  (first.objects||[]).forEach(it=>addItem(map,it));
  log('First page objects:', (first.objects||[]).length, 'Total count:', total);

  for(let offset=limit; offset<total; offset+=limit){
    const page = await j(base + '&offset=' + offset);
    log('Fetched offset', offset, 'count', (page.objects||[]).length);
    (page.objects||[]).forEach(it=>addItem(map,it));
  }

  const out = {};
  for(const [pid,val] of map.entries()){ out[pid]=val; }
  const json = JSON.stringify(out, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  dl.href = URL.createObjectURL(blob);
  dl.style.display='inline-block';
  dl.textContent='Download kpis.json';
  setStatus('Done: ' + Object.keys(out).length + ' entries','ok');
  log('Done. Entries:', Object.keys(out).length, '\nExample:', Object.entries(out).slice(0,1)[0]||{});
}

async function testAPI(){
  try{
    setStatus('Testing…','warn');
    const probe = await j('https://www.govtrack.us/api/v2/role?current=true&limit=1&fields=person__id,total_votes');
    setStatus('OK — API reachable','ok');
    log('Sample:', probe);
  }catch(e){
    setStatus('Blocked — see notes below','bad');
    log('Failed:', e.message);
    log('If blocked: 1) Make sure you are on http://localhost:5500  2) Try a different browser  3) Temporarily disable privacy/CORS extensions for this tab.');
  }
}

btnBuild.onclick = () => buildKPIs().catch(e=>{ setStatus('Failed','bad'); log('Build failed:', e.message); });
btnTest.onclick = () => testAPI();
</script>
</body>
</html>
